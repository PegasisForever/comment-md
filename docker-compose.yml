services:
  comment-md:
    build: .
    image: pegasis0/comment-md:latest
    container_name: comment-md
    restart: unless-stopped
    ports:
      - "3210:3210"
    environment:
      HOST: 0.0.0.0
      PORT: 3210
      DATABASE_URL: file:/data/comment-md.db
      # Optional: when set, the CLI's `create`/`update` prints a public
      # share URL using this base instead of COMMENT_MD_SERVER_URL.
      # COMMENT_MD_SHARE_BASE_URL: https://notes.example.com
    volumes:
      - comment-md-data:/data

volumes:
  comment-md-data:
