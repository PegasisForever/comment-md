services:
  comment-md:
    build: .
    image: pegasis0/comment-md:latest
    container_name: comment-md
    restart: unless-stopped
    ports:
      - "3210:3210"
    environment:
      HOST: 0.0.0.0
      PORT: 3210
      DATABASE_URL: file:/data/comment-md.db
      # Optional: public origin of the server. When set, this is used in
      # the `shareUrl` field returned by `note.create` / `note.update`
      # (and therefore the second line of `comment-md create` / `update`
      # stdout). Useful when the container sits behind a reverse proxy at
      # a different hostname. When unset the server falls back to
      # X-Forwarded-* headers or the inbound Host header.
      # COMMENT_MD_SHARE_BASE_URL: https://notes.example.com
    volumes:
      - comment-md-data:/data

volumes:
  comment-md-data:
